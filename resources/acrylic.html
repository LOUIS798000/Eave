<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>edge-drop acrylic layer</title>
    <style>
      /* Deliberately empty: DWM composites the blurred desktop *behind* this
         window, and anything painted here would cover it up. Keep the client
         area fully transparent. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body></body>
</html>
